name: Build APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK (with verbose output)
        run: gradle assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Display Build Log
        if: always()
        run: |
          echo "=== GRADLE BUILD LOG ==="
          cat build.log | tail -100

      - name: Find APK files
        if: always()
        run: |
          echo "🔍 Searching for APK files..."
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          echo "📂 Build output structure:"
          if [ -d "app/build" ]; then
            find app/build -type d -name "outputs" -o -name "apk" | head -20
          fi

      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinkOpt-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
