name: Build APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      gemini_api_key:
        description: 'Gemini API Key'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create .env file
        run: |
          API_KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="PLACEHOLDER_API_KEY"
            echo "⚠️  WARNING: GEMINI_API_KEY secret not set. Using placeholder."
          fi
          echo "GEMINI_API_KEY=$API_KEY" > .env
          echo "✅ .env file created"

      - name: List project structure
        run: |
          echo "📁 Project structure:"
          find . -maxdepth 2 -type f -name "build.gradle*" | head -20

      - name: Build Debug APK
        run: gradle assembleDebug -x lint --stacktrace

      - name: Find APK files
        run: |
          echo "🔍 Searching for APK files..."
          find . -name "*.apk" -type f
          echo ""
          echo "📂 Checking build output directory:"
          if [ -d "app/build/outputs/apk" ]; then
            ls -lR app/build/outputs/apk/
          else
            echo "❌ app/build/outputs/apk/ does not exist"
            echo "📂 Listing app/build:"
            ls -lR app/build/ 2>/dev/null | head -50
          fi

      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinkOpt-Debug-APK
          path: |
            app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30
